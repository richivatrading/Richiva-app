name: richiva
description: Richiva fashion e-commerce app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  camera: ^0.11.0+2
  shared_preferences: ^2.3.3
  pin_code_fields: ^8.0.1
  intl: ^0.19.0
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/